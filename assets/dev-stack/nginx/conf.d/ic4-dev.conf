# IC4 dev site — plain HTTP on :8080 (port pinned so PHP-built redirect
# URLs don't drop the port; see fastcgi_param HTTP_HOST below)
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Never serve .git / hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        # Pin host:port on the non-standard port, else the app builds
        # redirect URLs without the port and drops it.
        fastcgi_param HTTP_HOST localhost:8080;
        fastcgi_param SERVER_PORT 8080;
    }
}
