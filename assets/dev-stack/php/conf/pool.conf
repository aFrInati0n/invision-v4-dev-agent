; IC4 dev pool.
;
; NOTE: the base php-fpm image ships /usr/local/etc/php-fpm.d/docker.conf,
; which declares a `[www]` pool with NO user/group (it expects www.conf to
; provide them; www.conf is removed here). Pool sections with the same name
; MERGE across included files (alphabetical order: docker.conf < ic4-dev.conf
; < zz-docker.conf), so we must use the SAME section name `[www]` to complete
; that pool — a different name would create a second pool and leave [www]
; broken ("[pool www] user has not been defined").
;
; clear_env = yes (0) is REQUIRED so that `environment:` values from
; docker-compose (e.g. IC4_DEV=1) reach PHP — with the default (clear_env=-1)
; PHP sees none of them.
[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0666
clear_env = yes
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /var/www/html
catch_workers_output = yes
php_admin_value[error_log] = /dev/stderr
; Dev visibility (safe: dev-only, never used in production)
php_admin_value[display_errors] = stderr
php_admin_value[log_errors] = 1
